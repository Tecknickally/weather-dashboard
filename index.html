<script>
async function loadPSI() {
    const psiElement = document.getElementById('psi');

    try {
        const response = await fetch(
            'https://api-open.data.gov.sg/v2/real-time/api/psi'
        );

        const result = await response.json();

        const psi =
            result.data.items[0].readings.psi_twenty_four_hourly;

        psiElement.innerHTML = `
            Central: ${psi.central}<br>
            North: ${psi.north}<br>
            South: ${psi.south}<br>
            East: ${psi.east}<br>
            West: ${psi.west}
        `;
    } catch (error) {
        console.error(error);
        psiElement.innerHTML = 'Unable to load PSI data';
    }
}

loadPSI();
</script>
