<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singapore Weather Dashboard</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f4f6f9;
}

h1{
    text-align:center;
    color:#0078d4;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.metric{
    background:#f5f7fa;
    text-align:center;
    padding:12px;
    border-radius:8px;
}

.metric-value{
    font-size:22px;
    font-weight:bold;
    color:#0078d4;
}

.forecast-card{
    background:#f5f7fa;
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
}

.loading{
    color:#666;
}
</style>
</head>

<body>

<h1>🌤 Singapore Weather Dashboard</h1>

<div class="card">
    <h2>Today's Weather</h2>
    <div id="overview" class="loading">Loading...</div>
</div>

<div class="card">
    <h2>🌫 PSI (24 Hour)</h2>
    <div id="psi">Loading...</div>
</div>

<div class="card">
    <h2>🫁 PM2.5 (24 Hour)</h2>
    <div id="pm25">Loading...</div>
</div>

<div class="card">
    <h2>📅 5-Day Forecast</h2>
    <div id="forecast5">Loading...</div>
</div>

<script>

async function loadPSI() {

    try {

        const response = await fetch(
            "https://api-open.data.gov.sg/v2/real-time/api/psi"
        );

        const data = await response.json();

        const psi =
            data.data.items[0].readings.psi_twenty_four_hourly;

        document.getElementById("psi").innerHTML = `
        <div class="grid">
            <div class="metric">
                <div>Central</div>
                <div class="metric-value">${psi.central}</div>
            </div>

            <div class="metric">
                <div>North</div>
                <div class="metric-value">${psi.north}</div>
            </div>

            <div class="metric">
                <div>South</div>
                <div class="metric-value">${psi.south}</div>
            </div>

            <div class="metric">
                <div>East</div>
                <div class="metric-value">${psi.east}</div>
            </div>

            <div class="metric">
                <div>West</div>
                <div class="metric-value">${psi.west}</div>
            </div>
        </div>
        `;

        const pm25 =
            data.data.items[0].readings.pm25_twenty_four_hourly;

        document.getElementById("pm25").innerHTML = `
        <div class="grid">
            <div class="metric">
                <div>Central</div>
                <div class="metric-value">${pm25.central}</div>
            </div>

            <div class="metric">
                <div>North</div>
                <div class="metric-value">${pm25.north}</div>
            </div>

            <div class="metric">
                <div>South</div>
                <div class="metric-value">${pm25.south}</div>
            </div>

            <div class="metric">
                <div>East</div>
                <div class="metric-value">${pm25.east}</div>
            </div>

            <div class="metric">
                <div>West</div>
                <div class="metric-value">${pm25.west}</div>
            </div>
        </div>
        `;

    } catch(err){

        document.getElementById("psi").innerHTML =
            "Unable to load PSI";

        document.getElementById("pm25").innerHTML =
            "Unable to load PM2.5";
    }
}

async function loadForecast() {

    try {

        const response = await fetch(
            "https://api-open.data.gov.sg/v2/real-time/api/four-day-outlook"
        );

        const data = await response.json();

        console.log("Forecast API Response:", data);

        document.getElementById("forecast5").innerHTML =
            "<pre>" +
            JSON.stringify(data, null, 2) +
            "</pre>";

    } catch(err){

        document.getElementById("forecast5").innerHTML =
            "Forecast Error: " + err.message;
    }

    } catch(err){

        document.getElementById("forecast5").innerHTML =
            "Unable to load forecast";
    }
}

async function loadOverview() {

    document.getElementById("overview").innerHTML =
        `
        ✅ Dashboard Online<br>
        ✅ Singapore Government API Connected<br>
        ✅ Auto Refresh Enabled
        `;
}

loadOverview();
loadPSI();
loadForecast();

setInterval(() => {
    loadPSI();
    loadForecast();
}, 300000);

</script>
