<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singapore Weather Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 20px;
}

h1 {
    text-align: center;
    color: #0078d4;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.loading {
    color: #666;
}

.psi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
}

.psi-item {
    background: #f5f5f5;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
}

.value {
    font-size: 24px;
    font-weight: bold;
    color: #0078d4;
}
</style>
</head>

<body>

<h1>🌤 Singapore Weather Dashboard</h1>

<div class="card">
    <h2>☁ 2-Hour Forecast</h2>
    <div id="forecast" class="loading">Loading forecast...</div>
</div>

<div class="card">
    <h2>🌫 24-Hour PSI</h2>
    <div id="psi" class="loading">Loading PSI...</div>
</div>

<script>
async function loadForecast() {
    try {
        const response = await fetch(
            "https://api-open.data.gov.sg/v2/real-time/api/two-hr-forecast"
        );

        const data = await response.json();

        const forecast =
            data.data.items[0].forecasts[0];

        document.getElementById("forecast").innerHTML = `
            <strong>${forecast.area}</strong><br>
            ${forecast.forecast}
        `;
    }
    catch(error) {
        document.getElementById("forecast").innerHTML =
            "Unable to load forecast";
    }
}

async function loadPSI() {
    try {
        const response = await fetch(
            "https://api-open.data.gov.sg/v2/real-time/api/psi"
        );

        const data = await response.json();

        const psi =
            data.data.items[0].readings.psi_twenty_four_hourly;

        document.getElementById("psi").innerHTML = `
            <div class="psi-grid">
                <div class="psi-item">
                    <div>Central</div>
                    <div class="value">${psi.central}</div>
                </div>

                <div class="psi-item">
                    <div>North</div>
                    <div class="value">${psi.north}</div>
                </div>

                <div class="psi-item">
                    <div>South</div>
                    <div class="value">${psi.south}</div>
                </div>

                <div class="psi-item">
                    <div>East</div>
                    <div class="value">${psi.east}</div>
                </div>

                <div class="psi-item">
                    <div>West</div>
                    <div class="value">${psi.west}</div>
                </div>
            </div>
        `;
    }
    catch(error) {
        document.getElementById("psi").innerHTML =
            "Unable to load PSI";
    }
}

loadForecast();
loadPSI();
</script>

</body>
</html>
