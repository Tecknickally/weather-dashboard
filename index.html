<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singapore Weather Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 20px;
    margin: 0;
}

h1 {
color: #0078d4;
text-align: center;
}
 
.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
gap: 20px;
margin-bottom: 20px;
}
 
.card {
background: white;
border-radius: 12px;
padding: 20px;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card h2 {
    margin-top: 0;
}
    
.forecast-day {
padding: 12px;
margin-bottom: 10px;
background: #f8f9fa;
border-radius: 10px;
}   
</style>
</head>
    
<body>

<h1>🌤 Singapore Weather Dashboard</h1>

<div class="grid">

    <div class="card">
        <h2>🌡️ Temperature</h2>
        <div id="temperature">Loading...</div>
    </div>

    <div class="card">
        <h2>☔ Rainfall</h2>
        <div id="rainfall">Loading...</div>
    </div>

    <div class="card">
        <h2>🌫️ PSI</h2>
        <div id="psi">Loading...</div>
    </div>

    <div class="card">
        <h2>🌫️ PM2.5</h2>
        <div id="pm25">Loading...</div>
    </div>

</div>

<div class="card">
    <h2>📅 4-Day Forecast</h2>
    <div id="forecast4">Loading...</div>
</div>
    
<script>

async function loadTemperature() {

    try {

        const response = await fetch(
            "https://api-open.data.gov.sg/v2/real-time/api/air-temperature"
        );

        const data = await response.json();

        document.getElementById("temperature").innerHTML =
            "<pre>" + JSON.stringify(data, null, 2) + "</pre>";

    } catch(error) {

        document.getElementById("temperature").innerHTML =
            error.message;
    }
}

async function loadRainfall() {

    try {

        const response = await fetch(
            "https://api-open.data.gov.sg/v2/real-time/api/rainfall"
        );

        const data = await response.json();

        const rainfall =
            data.data.readings[0];

    document.getElementById("rainfall").innerHTML =
            rainfall.value + " mm";

    } catch(error) {

        console.error(error);
        
        document.getElementById("rainfall").innerHTML =
            "Unavailable";
    }
}    
    
    async function loadPSI() {

    try {

        const response = await fetch(
            "https://api-open.data.gov.sg/v2/real-time/api/psi"
        );

        const data = await response.json();

    document.getElementById("psi").innerHTML =
            "<pre>" + JSON.stringify(data, null, 2) + "</pre>";

        document.getElementById("pm25").innerHTML = "";

    } catch(error) {

        document.getElementById("psi").innerHTML =
            error.message;
    }
}

async function loadForecast() {

    try {

        const response = await fetch(
            "https://api-open.data.gov.sg/v2/real-time/api/four-day-outlook"
        );

        const data = await response.json();

        const forecasts =
            data.data.records[0].forecasts;

        let html = "";

        forecasts.forEach(day => {

            html += `
                <div class="forecast-day">
                    <strong>${day.date}</strong><br>
                    ${day.forecast.text}<br>
                    🌡️ ${day.temperature.low}°C - ${day.temperature.high}°C
                </div>
            `;
        });

        document.getElementById("forecast4").innerHTML =
            html;

    } catch (error) {

        console.error(error);

        document.getElementById("forecast4").innerHTML =
            "Unable to load forecast";
    }
}

loadTemperature();
loadRainfall();
loadPSI();
loadForecast();

</script>

</body>
</html>
