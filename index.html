<!DOCTYPE html>
<html>
<head>
<title>Singapore Weather Dashboard</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 20px;
}

h1 {
    color: #0078d4;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<h1>🌤 Singapore Weather Dashboard</h1>

<div class="card">
    <h2>Current Weather</h2>
    <p id="weather">Loading...</p>
</div>

<div class="card">
    <h2>PSI</h2>
    <p id="psi">Loading...</p>
</div>

<script>
async function loadPSI() {
    try {
        const response = await fetch(
          'https://api-open.data.gov.sg/v2/real-time/api/psi'
        );

        const data = await response.json();

        document.getElementById('psi').innerHTML =
            '24-Hour PSI: ' +
            data.data.items[0].readings.psi_twenty_four_hourly.national;
    }
    catch(error) {
        document.getElementById('psi').innerHTML =
            'Unable to load PSI data';
    }
}

loadPSI();
</script>

</body>
</html>
